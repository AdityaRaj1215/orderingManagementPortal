server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: osp
    password: osp_local_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

product-service:
  base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
